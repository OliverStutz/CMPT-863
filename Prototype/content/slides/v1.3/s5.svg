<text x="124" y="644" font-size="40" fill="#1F2933"><tspan x="124" dy="0">Ready in 8 months, before our insurance renews in 10 months</tspan></text></g>
<g id="s5.b3"><rect x="80" y="724.2" width="14" height="14" fill="#D9822B"/>
<text x="124" y="748" font-size="40" fill="#1F2933"><tspan x="124" dy="0">If we wait: a higher premium or no cover, and our largest customer's contract at risk</tspan></text></g>
