# Deploy on push to main (dev), or by hand for dev or prod (architecture 13).
#
# Set these as GitHub *environment* variables on environments "dev" and "prod"
# (Settings > Environments), one set per GCP project; values come from the
# bootstrap outputs:
#   GCP_PROJECT_ID     project id (OPEN Q)
#   GCP_REGION         e.g. northamerica-northeast1
#   GCP_WIF_PROVIDER   projects/<number>/locations/global/workloadIdentityPools/github-actions/providers/github
#   GCP_DEPLOY_SA      ci-deploy@<project>.iam.gserviceaccount.com
#   GCP_TERRAFORM_SA   ci-terraform-apply@<project>.iam.gserviceaccount.com
#   TF_STATE_BUCKET    <project>-tfstate
#   ALERT_EMAIL        optional, alert address
# Protect environment "prod" with required reviewers (manual approval).
# No JSON keys are used anywhere.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write # for Workload Identity Federation

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  # DECISION: push to main deploys dev; prod only through workflow_dispatch on main,
  # behind the protected "prod" environment. Each environment builds and pushes its
  # own image into its own project's registry, since dev and prod are separate projects.
  DEPLOY_ENV: ${{ inputs.environment || 'dev' }}

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push
        id: push
        env:
          REGION: ${{ vars.GCP_REGION }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          repo="${REGION}-docker.pkg.dev/${PROJECT}/study/api"
          docker build -t "${repo}:${GITHUB_SHA}" .
          docker push "${repo}:${GITHUB_SHA}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${repo}:${GITHUB_SHA}")"
          echo "image=${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${digest}"

  terraform:
    name: Terraform apply (${{ inputs.environment || 'dev' }})
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    outputs:
      content_bucket: ${{ steps.out.outputs.content_bucket }}
      service_url: ${{ steps.out.outputs.service_url }}
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_ci_deploy_sa_email: ${{ vars.GCP_DEPLOY_SA }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: terraform init
        working-directory: infra/terraform/envs/${{ env.DEPLOY_ENV }}
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform apply
        working-directory: infra/terraform/envs/${{ env.DEPLOY_ENV }}
        run: terraform apply -input=false -auto-approve -var="image_digest=${{ needs.image.outputs.image }}"

      - name: Outputs
        id: out
        working-directory: infra/terraform/envs/${{ env.DEPLOY_ENV }}
        run: |
          echo "content_bucket=$(terraform output -raw content_bucket)" >> "$GITHUB_OUTPUT"
          echo "service_url=$(terraform output -raw service_url)" >> "$GITHUB_OUTPUT"

  content:
    name: Upload content
    needs: terraform
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # DECISION: content/ is mirrored to the bucket root without deleting anything.
      # MP3s are git-ignored, so they are uploaded only if a step before this one
      # generated them (the tools/tts step of 11.1 is not wired in yet); otherwise
      # they are excluded and the ones already in the bucket stay untouched.
      - name: Sync content/ to the content bucket
        env:
          BUCKET: ${{ needs.terraform.outputs.content_bucket }}
        run: |
          if find content -name '*.mp3' -print -quit | grep -q .; then
            gcloud storage rsync content "gs://${BUCKET}" --recursive
          else
            gcloud storage rsync content "gs://${BUCKET}" --recursive --exclude='.*\.mp3$'
          fi

  smoke:
    name: Smoke test
    needs: [terraform, content]
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/v1/healthz
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "${{ needs.terraform.outputs.service_url }}/api/v1/healthz"; then exit 0; fi
            sleep 10
          done
          exit 1
